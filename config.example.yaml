# Occupancy survey configuration. Copy to config.yaml and edit `site`.
#
# Every value here is written into every dataset, so a dataset can be
# interpreted and merged without this file. Nothing may be left implicit.

site:
  # Required. How files from different receivers are kept apart when merged.
  site_id: "home-1"

  # Required. A quiet channel and a deaf receive path produce the same
  # number, and only these fields tell them apart.
  receiver_model: "SDRplay RSPdx"
  antenna: "discone, roof mount"
  antenna_height_m: 6.0
  preamp: "none"
  feedline: "RG-8X, 15 m"

  # What is physically in the coax ahead of the receiver. RECORDED, never
  # actuated -- the tool cannot see it, and it matters more than almost
  # anything else here. An unfiltered wideband front end near broadcast
  # transmitters generates its own signals, and that error correlates with
  # real traffic instead of averaging out. See docs/front-end.md.
  front_end_filters: "none"

  # OPTIONAL and deliberately coarse. Maidenhead, 4 or 6 characters only
  # (6 is about 5 x 8 km). Anything finer is refused, not truncated.
  # Delete this line entirely to share no location at all -- the dataset is
  # still valid and still mergeable.
  grid_square: "CM87"

  operator_note: ""

sdr:
  # gnuradio | rtl_sdr | synthetic
  # `gnuradio` is the path for a high-performance receiver (RSPdx, RSPduo,
  # USRP). It is the one that can actuate the per-band notch filters.
  backend: "gnuradio"

  # For backend: gnuradio -- rspdx, rspdxr2, rsp1a, rsp1b (SDRplay), or
  # rtlsdr, hackrf, lime, pluto, usrp, soapy. The RSP1A and RSP1B have one
  # antenna input and no HDR mode: leave antenna_port and hdr_mode out for
  # them. The RSP1 (no FM notch), RSP2 and RSPduo are not supported.
  device_type: "rspdx"

  # Wider is better here: fewer tune steps, so a shorter cycle and more
  # visits per hour. The RSPdx will do 6-10 MHz. usable_bandwidth_hz
  # follows this automatically.
  sample_rate_hz: 6000000
  fft_size: 8192

  # FIXED GAIN, AGC OFF. There is no agc_enabled setting: an AGC moves the
  # noise floor that every threshold here is relative to, so a survey taken
  # with one is worthless and the config loader refuses the key.
  #
  # RSPdx gain is expressed as SDRplay does it -- a REDUCTION in dB, where
  # larger means less gain. Set it once for a campaign: a run whose gain
  # changed midway cannot be pooled across the change. Verify the choice
  # with `--intermod-check` before collecting anything.
  #
  # The notch filters are NOT set here. They are per BAND -- the FM notch
  # is on for land mobile and off for the FM control band -- and the tool
  # actuates them on each band change. See docs/front-end.md.
  if_gain_reduction_db: 40
  rf_gain_reduction_db: 0
  # Per-band RF reduction, overriding rf_gain_reduction_db for the bands
  # named. The FM control band is the one that usually needs it: near a
  # city it is far stronger than land mobile, and at a land-mobile gain it
  # clips and the control cannot pass. Find the value by raising it until
  # the clip fraction on bcast_fm reads 0 (measured at one CM87 site: 50,
  # with the bands below at 20 -- a short bench sweep said 40, and a
  # 15-minute survey at 40 still clipped at 1.3e-3; judge it on a survey). Gain is set after tuning into each band
  # and recorded per band, so each band's gain stays fixed for a campaign.
  # band_rf_gain_reduction_db:
  #   bcast_fm: 40
  # Frequencies (MHz) where this receiver makes its own signal. MEASURE
  # them, do not copy someone else's: a channel that reads the same with
  # no antenna on the port, or that `--intermod-check` reports as
  # "internal". Channels on them are tagged in the dataset and left out of
  # service figures. Tuning-centre DC spikes are handled automatically.
  # spurs_mhz: [151.2, 152.4, 157.2]
  # Which physical input the antenna is on. Do not guess it: an input with
  # nothing on it does not error, it reports a quiet band -- and a quiet
  # band is this tool's output, so the failure is indistinguishable from
  # the finding. Find it with
  #
  #     python tools/probe_antennas.py --freq-mhz 162.475 --freq-mhz 465
  #
  # which compares the ports by how their noise floor moves with frequency.
  # Two frequencies at least 1.5x apart are needed; one tells you nothing,
  # because an open connector picks up strong local signals perfectly well.
  # RSPdx and RSPdx-R2: "Antenna A", "Antenna B" or "Antenna C". Omit on an
  # RSP1A or RSP1B, which have a single input.
  antenna_port: "Antenna B"

  # For backend: rtl_sdr -- tuner gain in dB. Must be > 0; rtl_sdr treats
  # 0 as automatic.
  gain: 40
  device_index: 0
  ppm: 0

sampling:
  # Sets the shortest detectable burst: 0.1 s gives a ~25 ms floor at a
  # 6 dB margin. See docs/sampling-design.md.
  integration_s: 0.1

  # Seconds per tune step per visit. Dwell-heavy beats revisit-heavy for a
  # duty-cycle statistic.
  dwell_s: 20.0

  revisit_target_s: 600.0

  # NOT a refinement. A fixed revisit period can alias against real traffic
  # periodicity and return a confidently wrong answer rather than a noisy
  # one. Setting this to 0 puts a warning in every dataset.
  jitter_fraction: 0.25

  # One output file per interval.
  interval_s: 3600.0

  # Visit a band on every Nth pass only. For the references, not the
  # targets: broadcast FM and NWR answer "is the receiver working", which a
  # few looks an hour settle, and their tune steps otherwise take nearly
  # half of every pass. `--plan` shows the effect. With a targeted list,
  # also cut FM to one window: make_channel_list.py --control-span-mhz 2.4.
  # band_visit_every:
  #   bcast_fm: 4
  #   nwr: 4

  # Central fraction of each tuning to trust; the edges roll off and carry
  # tuner artefacts.
  usable_fraction: 0.8

  # Defaults to sdr.sample_rate_hz. Only set this if the receiver's usable
  # passband is narrower than its sample rate -- setting it wider leaves
  # gaps between tune steps that look like quiet channels.
  # usable_bandwidth_hz: 2048000

detection:
  # dB above the baseline -- NOT an SNR. The baseline is a percentile of the
  # max-bin statistic and already sits above the mean noise power, so a
  # 10 dB threshold needs about 12.8 dB of SNR in a 12-bin channel. Run
  # `--plan` to see the detection edge for your configuration.
  threshold_db: 10.0
  baseline_percentile: 25.0
  baseline_window_sweeps: 64

# Targets plus known-continuous controls. The controls calibrate the
# threshold: if a strong broadcast-FM station does not read ~100%, the
# threshold or the receive path is wrong and the target numbers inherit the
# fault. NWR is NOT a reference -- see docs/nwr-measurement.md.
bands:
  - vhf_lmr_low
  - nwr
  - vhf_lmr_high
  - uhf_lmr
  - bcast_fm

output:
  dir: "./data"
